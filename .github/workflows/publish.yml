name: Publish

on:
  # Release flow: push an annotated tag matching v*.*.*
  #   git tag v0.2.0 && git push origin v0.2.0
  push:
    tags: ["v*"]
  # Manual trigger lets you exercise the full wheel matrix without cutting a
  # tag. The default target is `dry_run` (build only, no upload) so accidental
  # runs can never hit production; choose `pypi` to actually publish.
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - pypi
          - npm

jobs:
  # ── Build ────────────────────────────────────────────────────────
  build_wheels:
    name: Wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest     → manylinux x86_64 (native; do not set dual arch in
        #                       pyproject — that runs x86_64 Docker on ARM and
        #                       fails with "exec format error")
        # ubuntu-24.04-arm  → manylinux aarch64 (native)
        # macos-latest      → macOS arm64 (Apple Silicon; macos-14 label is
        #                       currently rejected on this org as
        #                       macos-14-arm64-us-default)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: pipx run build --sdist

      - name: Verify sdist contents
        run: |
          echo "── sdist contents ──"
          ls -la dist/
          tar tzf dist/*.tar.gz | head -60
          echo "── checking third_party/hnswlib is included ──"
          tar tzf dist/*.tar.gz | grep hnswlib | head -5

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── Publish: PyPI ────────────────────────────────────────────────
  # Runs only when a version tag was pushed, OR when dispatched manually
  # with target=pypi. The `environment: pypi` can be configured in the
  # repo settings to require a reviewer before this job runs.
  publish_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/project/logosdb/
    permissions:
      id-token: write   # Trusted Publishing (OIDC)
    steps:
      - name: Download all artifacts into dist/
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Publish: npm (logosdb, then logosdb-mcp-server) ───────────────
  publish_npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'npm')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (Trusted Publishing requires npm ≥ 11.5.1)
        run: |
          set -euo pipefail
          npm install -g npm@latest
          NPMV="$(npm -v)"
          echo "npm version: ${NPMV}"
          node -e "const [maj,min]='${NPMV}'.split('.').map(Number); if (maj < 11 || (maj === 11 && min < 5)) process.exit(1)"

      # n8n workspace pulls isolated-vm, whose install script compiles native code and
      # fails on GitHub-hosted runners; we only publish logosdb + logosdb-mcp-server.
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Vendor core for native addon
        run: npm run vendor-core -w logosdb

      - name: Build native addon
        run: npm run build -w logosdb

      - name: Publish logosdb (skip if version exists)
        working-directory: nodejs
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "logosdb@${VERSION}" version 2>/dev/null; then
            echo "logosdb ${VERSION} already on npm — skipping"
          else
            npm publish --access public
          fi

      - name: Build MCP server
        run: npm run build -w logosdb-mcp-server

      - name: Publish logosdb-mcp-server (skip if version exists)
        working-directory: mcp
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "logosdb-mcp-server@${VERSION}" version 2>/dev/null; then
            echo "logosdb-mcp-server ${VERSION} already on npm — skipping"
          else
            npm publish --access public
          fi
