version: "1.5.0"
title: "Live ids and bulk export"
date: "2026-11-24"
tagline: "Embedded vector DB for AI agents and RAG"
release_tagline: "Scan live rows in one call instead of one get() per id"
highlights:
  - name: "liveIds()"
    desc: "Ids of rows that are still in the index. Deleted rows are left out."
  - name: "rawVectors()"
    desc: "Every stored vector as float32, including float16 and int8 databases."
  - name: "exportNdjson()"
    desc: "Writes live rows to a file, one JSON object per line."
packages:
  - label: "PyPI logosdb"
    version: "1.5.0"
  - label: "npm logosdb"
    version: "1.5.0"
  - label: "npm logosdb-mcp-server"
    version: "1.4.4"
install: "pip install logosdb   ·   npm i logosdb"
github: "github.com/jose-compu/logosdb"