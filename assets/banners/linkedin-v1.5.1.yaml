version: "1.5.1"
title: "Search score ranges"
date: "2026-11-25"
tagline: "Embedded vector DB for AI agents and RAG"
release_tagline: "Score ranges now match the distance metric you picked"
highlights:
  - name: "DIST_COSINE"
    desc: "Score is cosine similarity, from -1 to 1. It is not forced into 0 to 1."
  - name: "DIST_IP"
    desc: "Score is the raw dot product. It can be negative or greater than 1."
  - name: "DIST_L2"
    desc: "Score is 1 / (1 + distance). Closer vectors score higher, between 0 and 1."
packages:
  - label: "PyPI logosdb"
    version: "1.5.1"
  - label: "npm logosdb"
    version: "1.5.1"
  - label: "npm logosdb-mcp-server"
    version: "1.4.4"
install: "pip install logosdb   ·   npm i logosdb"
github: "github.com/jose-compu/logosdb"